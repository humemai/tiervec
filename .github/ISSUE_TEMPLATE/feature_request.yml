name: Feature request
description: Propose a change or an addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today, or what is too slow, too big, or too hard? Say what you are building.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. A sketch of the API or of the behavior is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you tried, and what you decided against.
  - type: dropdown
    id: help
    attributes:
      label: Can you help?
      options:
        - I can open a pull request
        - I can test it
        - I can only describe it
    validations:
      required: true
