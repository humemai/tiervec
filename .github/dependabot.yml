# One grouped pull request a week per ecosystem, so a batch of releases is one review and one CI run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      maven:
        patterns:
          - "*"
  # The pins of the documentation build (MkDocs Material and mike). The build check shows what a bump breaks.
  - package-ecosystem: pip
    directory: /docs-site
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
    groups:
      docs-build:
        patterns:
          - "*"
