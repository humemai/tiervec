# Build and test on JDK 21 (the ArcadeDB baseline) and JDK 25. The fast tests run on every push and pull request; the slow tests
# (tag "slow": the long concurrency and stress programs) run in a separate job. Actions are pinned to full commit SHAs (see lint-workflows.yml).
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Toolchain
        run: |
          java -version
          mvn -B -ntp -version
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-fast-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # The benchmark harness (docs/BENCHMARKS.md, issues #12 and #68): the job compiles src/bench with the library (Maven does not compile it, as with
  # src/smoke) and runs it at n = 10,000 and dimension 768 as a smoke test. The harness compares every answer with an exact scan of its own and fails
  # the job when recall is below the floors set here, when an answer is malformed, or when the concurrent phase loses a vector or returns a deleted id.
  # The job is not a required check and it runs beside the fast tests, so it does not make them longer. It has no speed bar: a timing from a shared
  # runner is a ratio inside one run, never an absolute speed (README, "Platform support").
  bench-smoke:
    name: bench smoke (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Toolchain
        run: |
          java -version
          nproc
      - name: Compile the library and the harness
        run: |
          mkdir -p target/bench/classes
          find src/main/java src/bench/java -name '*.java' > target/bench/sources.txt
          javac -d target/bench/classes --add-modules jdk.incubator.vector @target/bench/sources.txt
      - name: Run the smoke
        run: |
          start=$(date +%s)
          timeout 600 java -Xmx2g --add-modules jdk.incubator.vector -cp target/bench/classes com.humemai.vec.Bench \
            --n 10000 --dim 768 --queries 100 --reps 3 --shares 0.1,0.01 --scan-below 0,1 \
            --conc-seconds 15 --conc-window-s 5 --write-rate 200 --delete-rate 50 --final-queries 50 \
            --min-recall 0.90 --min-scan-recall 0.99 --host-label github-runner --out target/bench/smoke.txt
          echo "smoke run: $(( $(date +%s) - start )) s"
      - name: Result file
        if: always()
        run: |
          grep -h -E '^(BENCH-SUMMARY|SEARCH|CONC |CONC-RECALL|BUILD )' target/bench/smoke.txt || true
          { echo '```'; cat target/bench/smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

  # The same fast tests on arm64 (NEON for the Vector API kernels). These jobs are not required checks; their names differ from the required
  # "fast tests (JDK 21)" and "fast tests (JDK 25)". Runner labels: ubuntu-24.04-arm is Linux arm64 and macos-15 is macOS arm64 (M1), both
  # standard GitHub-hosted runners, free on public repositories (https://docs.github.com/en/actions/reference/runners/github-hosted-runners).
  # The command and the test selection are the ones of the fast job above, including the scalar-twin execution.
  fast-arm64:
    name: fast tests (arm64 ${{ matrix.os_name }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            os_name: Linux
            java: "21"
          - os: ubuntu-24.04-arm
            os_name: Linux
            java: "25"
          - os: macos-15
            os_name: macOS
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Toolchain
        run: |
          uname -m
          java -version
          mvn -B -ntp -version
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-fast-arm64-${{ matrix.os_name }}-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # The fast tests on Windows x64 (issue #46). The job is not a required check; its name differs from the required "fast tests (JDK 21)" and
  # "fast tests (JDK 25)". windows-2025 is a standard GitHub-hosted runner (x64). The command is the one of the fast job above; the slow
  # tests do not run here. Steps run in bash (Git for Windows).
  fast-windows:
    name: fast tests (Windows x64, JDK 21)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Toolchain
        shell: bash
        run: |
          uname -m
          java -version
          mvn -B -ntp -version
      - name: Build and test
        shell: bash
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-fast-windows-jdk21
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  slow:
    name: slow tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # The slow job takes about 42 to 45 minutes since the record-id reuse and batch stress tests joined it; 45 was the first limit and a JDK 21
    # run was cancelled at it (run 42412345737). 90 leaves room; splitting the slow tests into two jobs per JDK is the way to make it short again.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Toolchain
        run: |
          java -version
          mvn -B -ntp -version
      - name: Build and run the slow tests
        run: mvn -B -ntp verify -Pslow
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-slow-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore
