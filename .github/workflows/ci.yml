# Build and test on JDK 21 (the ArcadeDB baseline) and JDK 25. The fast tests on x86-64 Linux and on Windows x64, and the benchmark smoke, run
# on every push to main and every pull request. The fast tests on arm64 run on every push to main, by hand, and on a pull request from a
# release/ branch (issue #150). The slow tests (tag "slow": the long concurrency and stress programs) are in slow-tests.yml and do not run on an
# ordinary pull request (issue #112).
#
# The checks of an ordinary pull request end in about 10 minutes, 15 at the very most (issue #154). Its fast tests therefore leave out the tests
# tagged "postmerge" (Maven profile "pr"). A push to main, a run by hand and a pull request from a release/ branch run the full fast set, and a
# fast test job that is red on main opens an issue (job `report`).
# Actions are pinned to full commit SHAs (see lint-workflows.yml).
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # "-Ppr" on an ordinary pull request, empty on every other run, so that every other run has the full fast set (issue #154).
  FAST_PROFILE: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') && '-Ppr' || '' }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Toolchain
        run: |
          java -version
          mvn -B -ntp -version
      # FAST_PROFILE is unquoted on purpose: when it is empty, Maven gets no argument for it.
      - name: Build and test
        run: mvn -B -ntp verify $FAST_PROFILE
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-fast-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # The benchmark harness (docs/BENCHMARKS.md, issues #12 and #68): the job compiles src/bench with the library (Maven does not compile it, as with
  # src/smoke) and runs it at n = 10,000 and dimension 768 as a smoke test. The harness compares every answer with an exact scan of its own and fails
  # the job when recall is below the floors set here, when an answer is malformed, or when the concurrent phase loses a vector or returns a deleted id.
  # The job is not a required check and it runs beside the fast tests, so it does not make them longer. It has no speed bar: a timing from a shared
  # runner is a ratio inside one run, never an absolute speed (README, "Platform support").
  # Issue #108 added two paths to the harness, and the job runs both of them on a small generated data set (5,000 vectors of dimension 64, written
  # into target/ and not committed): the loader of a real embedding set (--data, the files of scripts/prep_real_dataset.py, which the job runs on a
  # parquet set in the layout of the DBpedia shards), and the JVector arm (--engine jvector, src/bench/jvector, JVector from the profile "bench").
  bench-smoke:
    name: bench smoke (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Toolchain
        run: |
          java -version
          nproc
      - name: Compile the library and the harness
        run: |
          mkdir -p target/bench/classes
          find src/main/java src/bench/java -name '*.java' > target/bench/sources.txt
          javac -d target/bench/classes --add-modules jdk.incubator.vector @target/bench/sources.txt
      - name: Run the smoke
        run: |
          start=$(date +%s)
          timeout 600 java -Xmx2g --add-modules jdk.incubator.vector -cp target/bench/classes ai.humem.tiervec.Bench \
            --n 10000 --dim 768 --queries 100 --reps 3 --ef-sweep 32 --shares 0.1,0.01 --scan-below 0,1 \
            --conc-seconds 15 --conc-window-s 5 --write-rate 200 --delete-rate 50 --final-queries 50 \
            --min-recall 0.90 --min-scan-recall 0.99 --host-label github-runner --out target/bench/smoke.txt
          echo "smoke run: $(( $(date +%s) - start )) s"
      - name: Control, the harness fails when a floor is not met
        run: |
          code=0
          timeout 300 java -Xmx1g --add-modules jdk.incubator.vector -cp target/bench/classes ai.humem.tiervec.Bench \
            --n 2000 --dim 128 --queries 20 --reps 1 --shares 0.1 --scan-below 0 --conc-seconds 0 \
            --min-recall 1.5 --host-label github-runner --out target/bench/control.txt > target/bench/control.log || code=$?
          echo "control exit code: $code"
          test "$code" -eq 1
          grep -q '^BENCH-FAILURE .*below the floor' target/bench/control.txt
      # issue #159: the agent-memory benchmark checks its own parts: the runbook, the exact answers and the violation counters
      - name: The checks of the agent-memory benchmark
        run: timeout 300 java -Xmx1g --add-modules jdk.incubator.vector -cp target/bench/classes ai.humem.tiervec.AgentMemorySelfCheck
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
      - name: Prepare a small data set in the layout of the real one
        run: |
          uv run --python 3.12 .github/scripts/make-smoke-parquet.py target/bench/smoke-parquet 5100 64 3
          uv run --python 3.12 scripts/prep_real_dataset.py target/bench/smoke-parquet target/bench/smoke-data --queries 100 --truth-k 10 --block-rows 2000
          cat target/bench/smoke-data/meta.properties
          ls -l target/bench/smoke-data
          grep -q '^count=5000$' target/bench/smoke-data/meta.properties
          grep -q '^queries=100$' target/bench/smoke-data/meta.properties
      - name: Fetch JVector (profile bench) and compile the JVector arm
        run: |
          mvn -B -ntp -Pbench dependency:copy-dependencies -DoutputDirectory=target/bench/lib -DincludeScope=runtime
          ls -l target/bench/lib
          ls target/bench/lib | grep -q '^jvector-'
          javac -d target/bench/classes --add-modules jdk.incubator.vector -cp 'target/bench/classes:target/bench/lib/*' \
            src/bench/jvector/java/ai/humem/tiervec/JVectorArm.java
      - name: The library keeps no run-time dependency
        run: |
          mvn -B -ntp dependency:list -DincludeScope=runtime -DoutputFile=target/bench/default-runtime-deps.txt
          test -f target/bench/default-runtime-deps.txt
          cat target/bench/default-runtime-deps.txt
          if grep -qi jvector target/bench/default-runtime-deps.txt; then echo "JVector is in the default dependency set"; exit 1; fi
      - name: Run both arms on the data set
        run: |
          common=(--data target/bench/smoke-data --queries 100 --reps 3 --ef-sweep 32 --min-recall 0.85 --host-label github-runner)
          # the tier needs no JVector jar on the class path: it runs the same files as before (shares 0.1 also checks the file's answers against the harness's own scan)
          timeout 300 java -Xmx2g --add-modules jdk.incubator.vector -cp target/bench/classes ai.humem.tiervec.Bench \
            "${common[@]}" --engine tiervec --shares 0.1 --scan-below 0,1 --min-scan-recall 0.99 --out target/bench/data-tiervec.txt
          timeout 300 java -Xmx2g --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -cp 'target/bench/classes:target/bench/lib/*' ai.humem.tiervec.Bench \
            "${common[@]}" --engine jvector --out target/bench/data-jvector.txt
      - name: The two result files read side by side
        run: |
          for e in tiervec jvector; do
            f=target/bench/data-$e.txt
            grep -q '^BENCH-SUMMARY status=OK failures=0' "$f"
            grep -q '^DATASET .*dim=64 ' "$f"
            grep -h -E '^(TRUTH-CHECK|BUILD |JVECTOR|MEMORY afterBuild|SEARCH kind=unfiltered)' "$f"
          done
          grep -q '^TRUTH-CHECK fileVsExactScanOverlap=' target/bench/data-tiervec.txt
          grep -q '^JVECTOR jar=jvector-.* provider=.* M=16 efConstruction=200 ' target/bench/data-jvector.txt
          a=$(grep '^SEARCH kind=unfiltered' target/bench/data-tiervec.txt | grep -o ' ef=[0-9]*' | tr '\n' ' ')
          b=$(grep '^SEARCH kind=unfiltered' target/bench/data-jvector.txt | grep -o ' ef=[0-9]*' | tr '\n' ' ')
          echo "tiervec cells: $a"
          echo "jvector cells: $b"
          test -n "$a"
          test "$a" = "$b"
          # the same vectors and queries went into both
          n=$(grep -h -o 'checksumFirst1000AndQuery0=[0-9a-f]*' target/bench/data-tiervec.txt target/bench/data-jvector.txt | sort -u | wc -l)
          test "$n" -eq 1
      - name: Quantized arms, matched recall, the index on disk and the checks of the writes
        run: |
          common=(--data target/bench/smoke-data --queries 100 --reps 2 --ef-sweep 32 --targets 0.9,0.99 --shares 0.5 --host-label github-runner)
          run() { timeout 300 java -Xmx2g --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -cp 'target/bench/classes:target/bench/lib/*' ai.humem.tiervec.Bench "$@"; }
          tier=(--engine tiervec --load rebuild --scan-below 0 --props 1500)
          run "${common[@]}" "${tier[@]}" --disk target/bench/disk-tier --out target/bench/m-tier-fp32.txt
          run "${common[@]}" "${tier[@]}" --quant sq8 --disk target/bench/disk-sq8 --out target/bench/m-tier-sq8.txt
          run "${common[@]}" --engine jvector --disk target/bench/disk-jv --out target/bench/m-jv-fp32.txt
          run "${common[@]}" --engine jvector --quant int8 --disk target/bench/disk-jv-int8 --out target/bench/m-jv-int8.txt
          for f in target/bench/m-*.txt; do
            echo "== $f"
            grep -h -E '^(BENCH-SUMMARY|JVECTOR|MEMORY-INDEX|MATCHED|DISK|PROPS|SEARCH kind=filtered)' "$f"
            grep -q '^BENCH-SUMMARY status=OK failures=0' "$f"
            grep -q '^MEMORY-INDEX ' "$f"
            grep -q -E '^MATCHED mode=[a-z0-9-]+ target=0.9 status=(ok|floor) ' "$f"
            grep -q '^DISK .* bytes=[1-9]' "$f"
          done
          grep -q '^CONFIG .*sq8=true' target/bench/m-tier-sq8.txt
          grep -q '^MATCHED mode=sq8 ' target/bench/m-tier-sq8.txt
          grep -q '^PROPS newIds=1500 newMissedByNextSearch=0 ' target/bench/m-tier-fp32.txt
          grep -q '^PROPS newIds=1500 newMissedByNextSearch=0 ' target/bench/m-tier-sq8.txt
          grep -q '^JVECTOR jar=jvector-4.1.0-rc.1.jar .* quant=int8 ' target/bench/m-jv-int8.txt
          grep -q '^MATCHED mode=int8 ' target/bench/m-jv-int8.txt
          grep -q '^MATCHED mode=int8-rerank ' target/bench/m-jv-int8.txt
          grep -q '^SEARCH kind=filtered .* mode=int8-rerank$' target/bench/m-jv-int8.txt
          code=0
          run --data target/bench/smoke-data --engine jvector --quant sq8 > target/bench/wrong-quant.log 2>&1 || code=$?
          echo "sq8 with the JVector engine, exit code: $code"
          test "$code" -eq 2
          # on Java 22 and later the runs above use JVector's native provider when it loads; this one forces the Vector API provider
          timeout 300 java -Xmx2g --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Djvector.vectorization_provider=panama \
            -cp 'target/bench/classes:target/bench/lib/*' ai.humem.tiervec.Bench --data target/bench/smoke-data --queries 100 --reps 1 --ef-sweep "" \
            --engine jvector --quant int8 --host-label github-runner --out target/bench/panama-jv-int8.txt
          grep -q '^JVECTOR .* provider=PanamaVectorizationProvider ' target/bench/panama-jv-int8.txt
      - name: Control, a floor that cannot be met fails on both new paths, and wrong options are refused
        run: |
          cp=('target/bench/classes:target/bench/lib/*')
          run() { timeout 300 java -Xmx2g --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -cp "${cp[0]}" ai.humem.tiervec.Bench "$@"; }
          for e in tiervec jvector; do
            code=0
            run --data target/bench/smoke-data --engine $e --queries 20 --reps 1 --shares "" --min-recall 1.5 --host-label github-runner \
              --out target/bench/control-$e.txt > target/bench/control-$e.log || code=$?
            echo "control $e exit code: $code"
            test "$code" -eq 1
            grep -q '^BENCH-FAILURE .*below the floor' target/bench/control-$e.txt
          done
          code=0
          run --data target/bench/smoke-data --n 123 > target/bench/wrong-n.log 2>&1 || code=$?
          echo "wrong --n exit code: $code"
          test "$code" -eq 2
          grep -q 'does not match the data file' target/bench/wrong-n.log
          code=0
          run --data target/bench/smoke-data --engine jvector --conc-seconds 10 > target/bench/wrong-conc.log 2>&1 || code=$?
          echo "jvector with a concurrent phase exit code: $code"
          test "$code" -eq 2
          code=0
          timeout 300 java -Xmx2g --add-modules jdk.incubator.vector -cp target/bench/classes ai.humem.tiervec.Bench \
            --data target/bench/smoke-data --engine jvector > target/bench/no-jvector.log 2>&1 || code=$?
          echo "jvector without the jars exit code: $code"
          test "$code" -eq 2
          grep -q 'needs the JVector arm and the JVector jars' target/bench/no-jvector.log
      # issue #16: many merges of one tier in a row, in both merge modes, on the same rows (MergeGenerations)
      - name: Successive merges in both merge modes
        run: |
          run() { timeout 300 java -Xmx2g --add-modules jdk.incubator.vector -cp target/bench/classes "$@"; }
          merges() { run -Xlog:gc:file="target/bench/gen-$1.gc.log":uptimemillis,level,tags ai.humem.tiervec.MergeGenerations --merge-mode "$1" \
            --data target/bench/smoke-data --base 3000 --add-pct 10 --delete-pct 10 --generations 3 --queries 100 --reps 2 --min-recall 0.85 \
            --host-label github-runner --out "target/bench/gen-$1.txt"; }
          for mode in rebuild insert; do
            merges "$mode"
            cat "target/bench/gen-$mode.txt"
            grep -E 'Pause' "target/bench/gen-$mode.gc.log" | tail -n 40
            grep -q '^GEN-SUMMARY status=OK failures=0' "target/bench/gen-$mode.txt"
            grep -q '^TRUTH-CHECK mismatchedQueries=0 ' "target/bench/gen-$mode.txt"
            test "$(grep -c '^GEN g=' "target/bench/gen-$mode.txt")" -eq 3
            grep -q 'Pause Full (System.gc())' "target/bench/gen-$mode.gc.log"
          done
          # each generation deletes 300 of 3,000 rows and adds 300: a rebuild puts every live row into a graph, an insert merge only the added ones
          test "$(grep -c '^GEN g=.* live=3000 .* built=3000 ' target/bench/gen-rebuild.txt)" -eq 3
          test "$(grep -c '^GEN g=.* live=3000 .* built=300 ' target/bench/gen-insert.txt)" -eq 3
          # both modes saw the same rows
          test "$(grep -h '^DATA ' target/bench/gen-rebuild.txt target/bench/gen-insert.txt | sed 's/ loadSeconds=.*//' | sort -u | wc -l)" -eq 1
          # a floor that cannot be met fails the run, and a wrong option is refused
          code=0
          run ai.humem.tiervec.MergeGenerations --data target/bench/smoke-data --base 3000 --generations 1 --queries 20 --reps 1 --min-recall 1.5 \
            > target/bench/gen-control.log || code=$?
          echo "control exit code: $code"
          test "$code" -eq 1
          grep -q '^GEN-FAILURE .*below the floor' target/bench/gen-control.log
          code=0
          run ai.humem.tiervec.MergeGenerations --data target/bench/smoke-data --merge-mode other > target/bench/gen-wrong.log 2>&1 || code=$?
          echo "wrong --merge-mode exit code: $code"
          test "$code" -eq 2
      # issue #4: a paced write stream with paced searches and the sealed reference (PacedWrites), on the cosine set and on an l2 set
      - name: Paced writes on a cosine and an l2 set
        run: |
          uv run --python 3.12 .github/scripts/make-smoke-hdf5.py target/bench/smoke.hdf5 5100 32 100
          uv run --python 3.12 scripts/prep_ann_hdf5.py target/bench/smoke.hdf5 target/bench/smoke-l2 --queries 100
          grep -q '^metric=l2$' target/bench/smoke-l2/meta.properties
          run() { timeout 300 java -Xmx2g --add-modules jdk.incubator.vector -cp target/bench/classes "$@"; }
          paced() { run ai.humem.tiervec.PacedWrites --base 3000 --inserts 2000 --rate 500 --search-rate 200 --idle-seconds 2 --queries 100 \
            --tail-limit 200 --small-limit 100 --max-segments 2 --merge-fan 2 --merge-trigger-ratio 0.05 --targets 0.9,0.99 --reps 1 --min-recall 0.85 \
            --host-label github-runner "$@"; }
          for set in smoke-data smoke-l2; do
            paced --data "target/bench/$set" --out "target/bench/paced-$set.txt"
            paced --data "target/bench/$set" --sealed true --split-beam false --out "target/bench/sealed-$set.txt"
            cat "target/bench/paced-$set.txt" "target/bench/sealed-$set.txt"
            for f in "target/bench/paced-$set.txt" "target/bench/sealed-$set.txt"; do
              grep -q '^PW-SUMMARY status=OK failures=0' "$f"
              grep -q '^FINAL live=5000 ' "$f"
              grep -q '^MATCHED split=false target=0.9 status=' "$f"
            done
            f="target/bench/paced-$set.txt"
            grep -q -E '^WINDOW bigMerges=[1-9]' "$f"
            grep -q '^STREAM inserts=2000 ' "$f"
            grep -q '^LAT phase=stream-merge split=true ' "$f"
            grep -q '^LAT phase=idle-after split=false ' "$f"
            grep -q '^SEARCH split=true ' "$f"
            grep -q '^FINAL live=5000 segments=1 ' "target/bench/sealed-$set.txt"
          done
          # both programs saw the same rows
          test "$(grep -h -o 'orderCrc=[0-9a-f]* first1000Crc=[0-9a-f]*' target/bench/paced-smoke-l2.txt target/bench/sealed-smoke-l2.txt | sort -u | wc -l)" -eq 1
          # an l2 set is refused by the programs that score by the cosine, and a wrong option is refused
          for main in Bench MergeGenerations; do
            code=0
            run ai.humem.tiervec.$main --data target/bench/smoke-l2 > "target/bench/l2-$main.log" 2>&1 || code=$?
            echo "$main on an l2 set, exit code: $code"
            test "$code" -eq 2
            grep -q 'is an l2 set' "target/bench/l2-$main.log"
          done
          code=0
          run ai.humem.tiervec.PacedWrites --data target/bench/smoke-l2 --split-beam maybe > target/bench/paced-wrong.log 2>&1 || code=$?
          echo "wrong --split-beam exit code: $code"
          test "$code" -eq 2
      - name: Result file
        if: always()
        run: |
          grep -h -E '^(BENCH-SUMMARY|SEARCH|CONC |CONC-RECALL|BUILD )' target/bench/smoke.txt || true
          { echo '```'; cat target/bench/smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          for f in target/bench/data-tiervec.txt target/bench/data-jvector.txt; do
            grep -h -E '^(BENCH-SUMMARY|TRUTH-CHECK|BUILD |JVECTOR|SEARCH)' "$f" || true
          done
          grep -H -E '^(BENCH-SUMMARY|JVECTOR|MEMORY-INDEX|MATCHED|DISK|PROPS)' target/bench/m-*.txt || true
          for f in target/bench/data-tiervec.txt target/bench/data-jvector.txt; do
            { echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          done

  # The same fast tests on arm64 (NEON for the Vector API kernels). These jobs are not required checks; their names differ from the required
  # "fast tests (JDK 21)" and "fast tests (JDK 25)". Runner labels: ubuntu-24.04-arm is Linux arm64 and macos-15 is macOS arm64 (M1), both
  # standard GitHub-hosted runners, free on public repositories (https://docs.github.com/en/actions/reference/runners/github-hosted-runners).
  # The command is the one of the fast job above without FAST_PROFILE: these jobs always run the full fast set, the scalar-twin execution included.
  # These jobs do not run on an ordinary pull request (issue #150: the organization runs 20 jobs at a time, and the extra platform jobs filled
  # the queue). They run on every push to main, by hand on any branch (gh workflow run ci.yml --ref <branch>, which runs every job of this
  # file), and on a pull request whose branch starts with release/, so that a release passes them before its merge (docs/RELEASING.md). A pull
  # request that skips them shows one skipped check, under the job name as it is written below. A red run on main opens an issue (job
  # `report`).
  fast-arm64:
    name: fast tests (arm64 ${{ matrix.os_name }}, JDK ${{ matrix.java }})
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            os_name: Linux
            java: "21"
          - os: ubuntu-24.04-arm
            os_name: Linux
            java: "25"
          - os: macos-15
            os_name: macOS
            java: "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Toolchain
        run: |
          uname -m
          java -version
          mvn -B -ntp -version
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-fast-arm64-${{ matrix.os_name }}-jdk${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # The fast tests on Windows x64 (issue #46). The job is a required check (issue #77); its name differs from the x86-64 Linux jobs "fast tests
  # (JDK 21)" and "fast tests (JDK 25)". windows-2025 is a standard GitHub-hosted runner (x64). The command and the test selection are the ones
  # of the fast job above; the slow tests do not run here. Steps run in bash (Git for Windows).
  fast-windows:
    name: fast tests (Windows x64, JDK 21)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Toolchain
        shell: bash
        run: |
          uname -m
          java -version
          mvn -B -ntp -version
      - name: Build and test
        shell: bash
        run: mvn -B -ntp verify $FAST_PROFILE
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-fast-windows-jdk21
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  # A push to main on which a fast test job failed or timed out opens an issue, or comments on it when it is already open: "Fast tests are red
  # on main" for x86-64 Linux and Windows, "arm64 tests are red on main" for arm64. An ordinary pull request does not run every test of these
  # jobs (and no arm64 job), so the run on main can be the first to show the failure. A person closes the issue when main is green again. A run
  # that a later push cancelled reports nothing (the later run does). The job has its own permissions so that `issues: write` is not granted
  # to the jobs that build and run the code.
  report:
    name: report a red fast test run on main
    needs: [fast, fast-windows, fast-arm64]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          X86_RESULTS: ${{ needs.fast.result }} ${{ needs.fast-windows.result }}
          ARM64_RESULT: ${{ needs.fast-arm64.result }}
        run: |
          set -euo pipefail
          # report <title> <why this run can be the first one that shows the failure>
          report() {
            local title="$1" why="$2" body="$RUNNER_TEMP/red.md" number
            {
              echo "A job did not pass on \`main\` at \`${SHA:0:7}\`: [$RUN_URL]($RUN_URL)."
              echo
              echo "$why Close this issue when a later run on \`main\` is green."
            } > "$body"
            number="$(gh api --method GET "repos/$REPO/issues" -f state=open -f labels=area:ci -F per_page=100 \
              --jq "map(select(.pull_request == null and .title == \"$title\")) | .[0].number // empty")"
            if [ -n "$number" ]; then
              gh api --method POST "repos/$REPO/issues/$number/comments" -F body=@"$body" --jq .html_url
            else
              gh api --method POST "repos/$REPO/issues" -f title="$title" -F body=@"$body" \
                -f "labels[]=bug" -f "labels[]=area:ci" -f "labels[]=now" -f "assignees[]=tae898" --jq .html_url
            fi
          }
          case "$X86_RESULTS" in
            *failure* | *cancelled*)
              report "Fast tests are red on main" "An ordinary pull request does not run the tests tagged \`postmerge\`, so this run can be the first one that shows the failure." ;;
          esac
          case "$ARM64_RESULT" in
            failure | cancelled)
              report "arm64 tests are red on main" "An ordinary pull request does not run these jobs, so this run can be the first one that shows the failure." ;;
          esac
