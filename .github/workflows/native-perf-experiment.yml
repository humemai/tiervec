# Round 5: the byte kernels of VKernels (dotI8, dotF8, dotF8x4, block16, all use convertShape) in the image. Same reduction as round 4: only the v1 arm
# (Vector API, build-time init) on CE 25.0.2 and Oracle 25, plus the JVM job as baseline. BenchV now runs the Vc8 variants cur, tx, cv and the Sb scalar loops.
# Round 4 reduction: only the v1 arm (Vector API, build-time init) on CE 25.0.2 and Oracle 25 (plus the JVM job); the flag arms, scalar images and
# the 25.5 job of round 2 are dropped to save runner minutes. BenchV now carries the L/A/M variants and dimensions 100 and 770.
# Experiment round 2 (branch native-perf-experiment only, never merged): why is the native image with the Vector API slow, and which
# flags or code shapes make kernels fast in a native image. One job per toolchain, all on ubuntu-latest; only ratios between arms inside
# ONE job are meaningful (the runner CPU is printed in every job). Every native build is tolerant: a failed build prints BUILD-FAILED.
name: Native Perf Experiment

on:
  push:
    branches:
      - native-perf-experiment
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CLASSES: target/bench/classes
  VEC: --add-modules jdk.incubator.vector
  VAPI: -H:+VectorAPISupport
  BT: --initialize-at-build-time=com.humemai.vec.Vc8

jobs:
  jvm:
    name: jvm 25 (C2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Prepare
        run: .github/perf/prep.sh
      - name: JVM 25, all variants
        run: |
          "$JAVA_HOME/bin/java" -Xmx2g $VEC -cp "$CLASSES" com.humemai.vec.BenchV jvm25

  ce25:
    name: graalvm ce 25.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm-community
          java-version: "25.0.2"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare
        run: |
          .github/perf/prep.sh
          native-image --version
          native-image --expert-options-all 2>&1 | grep -i -E 'vector' | cut -c1-250 | sed 's/^/EXPERT /' || true
      - name: A, Vector API in the image (build-time init), round 5 byte kernels
        run: .github/perf/nb.sh ce25 BenchV v1 $VEC $VAPI $BT

  ora25:
    name: oracle graalvm 25
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          distribution: graalvm
          java-version: "25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare
        run: |
          .github/perf/prep.sh
          native-image --version
          native-image --expert-options-all 2>&1 | grep -i -E 'vector' | cut -c1-250 | sed 's/^/EXPERT /' || true
      - name: A, Vector API in the image (build-time init), round 5 byte kernels
        run: .github/perf/nb.sh ora25 BenchV v1 $VEC $VAPI $BT
