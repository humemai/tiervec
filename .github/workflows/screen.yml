# The screen of the agent-memory benchmark (docs/AGENT-MEMORY-BENCHMARK.md, "The screen", issue #159): one runbook per small shape replayed
# into many named variants of the index, with measures that do not depend on timing (violations, recall under churn, distance computations, rows
# rebuilt per row written, memory per row). It runs by hand only, on any branch: gh workflow run screen.yml --ref <branch>. The result files
# are the artifact "screen-results", and the summary table is on the run page. A violation that fails a run makes the job red.
# Actions are pinned to full commit SHAs (see lint-workflows.yml).
name: Screen (agent memory)

on:
  workflow_dispatch:
    inputs:
      shapes:
        description: "Shapes, separated by ',': p20, p200, p2000, a10k, a100k. Empty: all but a100k"
        required: false
        default: ""
        type: string
      variants:
        description: "Variants 'name arm key=value ...' separated by ';'. Empty: src/bench/agent-memory-screen.variants"
        required: false
        default: ""
        type: string
      seed:
        description: "Seed of the runbooks"
        required: false
        default: "1"
        type: string
      dim:
        description: "Dimensions of the generated vectors. Empty: the default of the screen"
        required: false
        default: ""
        type: string
      latent:
        description: "Dimensions that the noise of the rows spans (docs/SCREEN-IDEAS.md). Empty: the default of the screen"
        required: false
        default: ""
        type: string
      clusters:
        description: "Clusters of a collection, at least 2. Empty: the default of the screen"
        required: false
        default: ""
        type: string
      turnover:
        description: "Retired row versions per live row, so how long the churn lasts. Empty: the default of the program, 3"
        required: false
        default: ""
        type: string
      checkpoints:
        description: "Checkpoints after the load. Empty: the default of the program, 10"
        required: false
        default: ""
        type: string
      mix:
        description: "write: 1 search per 8 written rows; read: 4 searches per written row"
        required: false
        default: "write"
        type: choice
        options:
          - write
          - read
      program:
        description: "agent-memory: the screen of the agent-memory benchmark. filtered-walk: the filter screen, seeds 1, 2, 3; it reads no other input"
        required: false
        default: "agent-memory"
        type: choice
        options:
          - agent-memory
          - filtered-walk

permissions:
  contents: read

jobs:
  screen:
    name: agent-memory screen (JDK 25)
    if: ${{ inputs.program != 'filtered-walk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
      # the libraries of the other arms (profile bench of the pom), for the benchmark class path only
      - name: Fetch the libraries of the other arms
        run: mvn -B -ntp -Pbench dependency:copy-dependencies -DoutputDirectory=target/bench/lib -DincludeScope=runtime
      - name: Compile the benchmark with the copy of the library that counts distances
        run: |
          uv run --no-project --python 3.12 scripts/instrument_distances.py src/main/java target/agent-memory/src
          mkdir -p target/agent-memory/classes
          find target/agent-memory/src src/bench/java src/bench/jvector -name '*.java' > target/agent-memory/sources.txt
          javac -d target/agent-memory/classes --add-modules jdk.incubator.vector -cp 'target/bench/lib/*' @target/agent-memory/sources.txt
      # the inputs reach the shell as environment variables, never as part of the script
      - name: Run the screen
        env:
          SHAPES: ${{ inputs.shapes }}
          VARIANTS: ${{ inputs.variants }}
          SEED: ${{ inputs.seed }}
          DIM: ${{ inputs.dim }}
          LATENT: ${{ inputs.latent }}
          CLUSTERS: ${{ inputs.clusters }}
          MIX: ${{ inputs.mix }}
          TURNOVER: ${{ inputs.turnover }}
          CHECKPOINTS: ${{ inputs.checkpoints }}
        run: |
          args=(--preset screen --seed "$SEED" --mix "$MIX" --out target/agent-memory/screen)
          if [ -n "$TURNOVER" ]; then args+=(--turnover "$TURNOVER"); fi
          if [ -n "$CHECKPOINTS" ]; then args+=(--checkpoints "$CHECKPOINTS"); fi
          if [ -n "$DIM" ]; then args+=(--dim "$DIM"); fi
          if [ -n "$LATENT" ]; then args+=(--latent "$LATENT"); fi
          if [ -n "$CLUSTERS" ]; then args+=(--clusters "$CLUSTERS"); fi
          if [ -n "$SHAPES" ]; then args+=(--shapes "$SHAPES"); fi
          if [ -n "$VARIANTS" ]; then args+=(--variants "$VARIANTS"); fi
          # JVector's Panama provider keeps its vectors on the heap, so they count in the heap column
          java -Xmx10g --add-modules jdk.incubator.vector -Djvector.vectorization_provider=panama \
            -cp 'target/agent-memory/classes:target/bench/lib/*' ai.humem.tiervec.AgentMemory "${args[@]}"
      - name: Summary
        if: always()
        run: cat target/agent-memory/screen/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      # the runbooks are left out: the same seed on the same commit writes them again, and result.txt holds their SHA-256
      - name: Upload the result files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-results
          path: |
            target/agent-memory/screen/result.txt
            target/agent-memory/screen/results.tsv
            target/agent-memory/screen/curve.tsv
            target/agent-memory/screen/graph.tsv
            target/agent-memory/screen/summary.md
          if-no-files-found: ignore

  # The filter screen (docs/SCREEN-IDEAS.md, "The filter screen", issue #162): gh workflow run screen.yml --ref <branch> -f program=filtered-walk
  # One job per registered seed, with the registered settings, which are the defaults of the program. The result files are the artifacts
  # "filtered-walk-results-seed-<seed>". A hit that a filter does not allow makes the job red.
  filtered:
    name: filter screen, seed ${{ matrix.seed }} (JDK 25)
    if: ${{ inputs.program == 'filtered-walk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.4"
      - name: Compile the benchmark with the copy of the library that counts distances
        run: |
          uv run --no-project --python 3.12 scripts/instrument_distances.py src/main/java target/filtered-walk/src
          mkdir -p target/filtered-walk/classes
          find target/filtered-walk/src src/bench/java -name '*.java' > target/filtered-walk/sources.txt
          javac -d target/filtered-walk/classes --add-modules jdk.incubator.vector @target/filtered-walk/sources.txt
      - name: Run the filter screen
        env:
          SEED: ${{ matrix.seed }}
        run: |
          java -Xmx10g --add-modules jdk.incubator.vector -cp target/filtered-walk/classes ai.humem.tiervec.FilterScreen \
            --seed "$SEED" --out target/filtered-walk/out
      - name: Summary
        if: always()
        run: cat target/filtered-walk/out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the result files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filtered-walk-results-seed-${{ matrix.seed }}
          path: |
            target/filtered-walk/out/result.txt
            target/filtered-walk/out/filter.tsv
            target/filtered-walk/out/summary.md
          if-no-files-found: ignore
