# Temporary, on the branch of issue #144 only, and removed before the merge. Two checks of the fix: the new test fails when the old lock is put
# back, and MergeInsertTest runs in rounds on the fixed code without a hang.
name: Temporary repro 144

on:
  push:
    branches:
      - merge-insert-hang-144

permissions:
  contents: read

jobs:
  old-lock:
    name: new test on the old lock (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: The test must fail with the old lock
        run: |
          sed -i 's/new ReentrantLock(true)/new ReentrantLock()/' src/main/java/ai/humem/tiervec/TieredIndex.java
          test "$(git diff --numstat | wc -l)" = 1
          for round in 1 2 3 4 5; do
            if mvn -B -ntp test -Dtest=TierControlTurnTest -Dsurefire.failIfNoSpecifiedTests=false -Dtest.scalar.skip=true > round.log 2>&1; then
              echo "ROUND $round PASSED on the old lock"
              exit 1
            fi
            echo "ROUND $round failed on the old lock:"
            grep -m1 'who seals after the worker' round.log || { tail -60 round.log; exit 1; }
          done

  rounds:
    name: MergeInsertTest rounds (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Rounds
        run: |
          for round in $(seq 1 14); do
            echo "ROUND $round"
            mvn -B -ntp test -Dtest=MergeInsertTest -Dsurefire.failIfNoSpecifiedTests=false -Dtest.scalar.skip=true || exit 1
          done
