# Read by the native-image builder for an application that has this jar on its class path (issue #44).
# NKernels fixes its Vector API species (256 bits, 128 bits on aarch64) in a static initializer. The image builder must run that initializer, so that
# the species is a constant of the image and the kernels compile to SIMD code. An initialization at run time gives slow kernels.
# If the module jdk.incubator.vector is not part of the image, the initializer catches the failure and Kernels uses the scalar twins.
# The Vector API itself needs two more builder options, which are not set here so that a scalar image stays possible: --add-modules jdk.incubator.vector
# and -H:+VectorAPISupport (GraalVM 25; see docs/DESIGN.md).
Args = --initialize-at-build-time=ai.humem.tiervec.NKernels
